quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=Minecraft11!
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/compitoprova



# =============================================================================
# LOGIN FORM AUTOMATICO
# =============================================================================
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login
# Se si sbaglia password, Quarkus ricarica la pagina aggiungendo ?error=true
quarkus.http.auth.form.error-page=/login?error=true
quarkus.http.auth.form.landing-page=/venues
quarkus.http.auth.form.cookie-name=quarkus-credential
quarkus.http.auth.form.timeout=PT30M

# =============================================================================
# Security: Elytron JDBC Realm (Connessione automatica al DB)
# =============================================================================
quarkus.security.jdbc.enabled=true
quarkus.security.jdbc.principal-query.sql=SELECT u.password, u.role FROM "users" u WHERE u.username=?

# CORRETTO: Diciamo a Quarkus che le password nel DB sono testuali (non criptate)
quarkus.security.jdbc.principal-query.bcrypt-password-mapper.enabled=true
quarkus.security.jdbc.principal-query.bcrypt-password-mapper.password-index=1
quarkus.security.jdbc.principal-query.attribute-mappings.0.index=2
quarkus.security.jdbc.principal-query.attribute-mappings.0.to=groups

# =============================================================================
# Authorization Policies (I Buttafuori automatici)
# =============================================================================
quarkus.http.auth.permission.public.paths=/,/login,/register,/q/*,/css/*,/js/*
quarkus.http.auth.permission.public.policy=permit

# CORRETTO: Proteggiamo tutte le azioni di modifica, non solo il /new!
quarkus.http.auth.permission.authenticated.paths=/venues/new,/venues/edit/*,/venues/delete/*,/venues/save
quarkus.http.auth.permission.authenticated.policy=authenticated

# Qute
quarkus.qute.content-types.html=text/html

quarkus.hibernate-orm.database.generation=update